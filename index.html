<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f1e8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Becoming · Personal Workspace</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <header class="brand"><span class="mark">B</span><div><strong>Becoming</strong><small>Personal Workspace</small></div></header>
      <nav id="nav" aria-label="主导航"></nav>
      <div class="privacy-note"><span>LOCAL ONLY</span><p>记录只保存在当前浏览器，不上传服务器。</p></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuButton" aria-label="打开导航">☰</button>
        <div id="breadcrumbs">首页 · Home</div>
        <div class="top-actions">
          <button class="ghost" id="searchButton">搜索 Search</button>
          <button class="primary" id="captureButton">＋ 收集 Capture</button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="editor"><form method="dialog" id="editorForm"><header><div><p class="eyebrow">EDIT LOCALLY</p><h2 id="editorTitle">编辑</h2></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header><div id="editorFields" class="form-grid"></div><footer><button type="button" class="danger" id="deleteButton">删除</button><span></span><button value="cancel" class="ghost">取消</button><button value="default" class="primary" id="saveButton">保存</button></footer></form></dialog>
  <dialog id="searchDialog"><form method="dialog"><header><div><p class="eyebrow">SEARCH</p><h2>全局搜索</h2></div><button value="cancel" class="icon-button" aria-label="关闭">×</button></header><input id="searchInput" class="search-input" placeholder="搜索标题、状态或备注…" autocomplete="off"><div id="searchResults" class="search-results"></div></form></dialog>
  <input type="file" id="importInput" accept="application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
